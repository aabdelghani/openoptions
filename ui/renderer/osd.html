<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self';">
  <link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
  <style>
    :root, [data-theme="light"], [data-theme="ubuntu"] { --hb: #fff; --fg: rgba(0,0,0,.85); --dim: rgba(0,0,0,.55); --trk: rgba(0,0,0,.18); --accbg: #3584e4; --ok: #1b8553; --warn: #9c6800; --err: #c30000; --btn: rgba(0,0,0,.08); }
    [data-theme="dark"], [data-theme="ubuntu-dark"] { --hb: #2e2e32; --fg: #fff; --dim: rgba(255,255,255,.55); --trk: rgba(255,255,255,.2); --accbg: #3584e4; --ok: #78e9ab; --warn: #ffc252; --err: #ff938c; --btn: rgba(255,255,255,.1); }
    [data-theme="ubuntu"], [data-theme="ubuntu-dark"] { --accbg: #e95420; }
    html, body { margin: 0; background: transparent; overflow: hidden; height: 100%; }
    body { font: 14px Cantarell, "Adwaita Sans", "Noto Sans", Inter, system-ui, sans-serif; color: var(--fg); display: flex; align-items: center; justify-content: center; }
    .toast { background: var(--hb); border-radius: 999px; box-shadow: 0 0 0 1px rgba(0,0,0,.2), 0 10px 28px rgba(0,0,0,.35); padding: 12px 22px 12px 14px; display: flex; align-items: center; gap: 14px; min-width: 240px; max-width: 420px; opacity: 0; transform: translateY(8px); transition: opacity .16s, transform .16s; }
    .toast.show { opacity: 1; transform: none; }
    .ic { width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #fff; background: var(--accbg); }
    .t { flex: 1; min-width: 0; }
    .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: 12px; color: var(--dim); }
    .segs { display: flex; gap: 3px; align-items: center; }
    .segs span { width: 8px; height: 18px; border-radius: 2px; background: var(--trk); }
    .segs span.on { background: var(--accbg); }
    .hosts { display: flex; gap: 4px; }
    .hosts span { width: 26px; height: 22px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; background: var(--btn); }
    .hosts span.on { background: var(--accbg); color: #fff; }
  </style>
</head>
<body>
  <div class="toast" id="toast"><span class="ic" id="ic"><i class="fa-solid fa-microphone-slash"></i></span><div class="t"><div class="title" id="title"></div><div class="sub" id="sub"></div></div><div id="extra"></div></div>
  <script src="osd.js"></script>
</body>
</html>
