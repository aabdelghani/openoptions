<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self';">
  <link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
  <style>
    :root, [data-theme="light"], [data-theme="ubuntu"] { --hb: #fff; --fg: rgba(0,0,0,.85); --dim: rgba(0,0,0,.55); --brd: rgba(0,0,0,.12); --btn: rgba(0,0,0,.08); --hov: rgba(0,0,0,.06); --accbg: #3584e4; }
    [data-theme="dark"], [data-theme="ubuntu-dark"] { --hb: #2e2e32; --fg: #fff; --dim: rgba(255,255,255,.55); --brd: rgba(255,255,255,.12); --btn: rgba(255,255,255,.1); --hov: rgba(255,255,255,.08); --accbg: #3584e4; }
    [data-theme="ubuntu"], [data-theme="ubuntu-dark"] { --accbg: #e95420; }
    html, body { margin: 0; background: transparent; height: 100%; overflow: hidden; }
    body { font: 13px Cantarell, "Adwaita Sans", "Noto Sans", Inter, system-ui, sans-serif; color: var(--fg); }
    .pk { position: absolute; inset: 0; background: var(--hb); border-radius: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,.2), 0 14px 40px rgba(0,0,0,.4); display: flex; flex-direction: column; overflow: hidden; }
    .top { display: flex; align-items: center; gap: 10px; padding: 12px 12px 8px; }
    .search { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--btn); border-radius: 8px; padding: 0 12px; height: 34px; }
    .search i { font-size: 12px; color: var(--dim); }
    .search input { flex: 1; border: 0; background: transparent; color: var(--fg); font: inherit; outline: none; min-width: 0; }
    .search input::placeholder { color: var(--dim); }
    kbd { font: 11px inherit; padding: 3px 7px; border: 1px solid var(--brd); border-radius: 5px; color: var(--dim); }
    .cats { display: flex; gap: 2px; padding: 0 12px 8px; }
    .cats button { flex: 1; height: 30px; border-radius: 7px; border: 0; background: transparent; color: var(--dim); font-size: 13px; cursor: pointer; }
    .cats button:hover { background: var(--hov); color: var(--fg); }
    .cats button.on { background: var(--accbg); color: #fff; }
    .body { flex: 1; overflow-y: auto; padding: 0 12px 6px; scroll-behavior: smooth; }
    .body::-webkit-scrollbar { width: 6px; } .body::-webkit-scrollbar-thumb { background: var(--btn); border-radius: 3px; }
    .h { padding: 6px 0; font-size: 11px; font-weight: 700; color: var(--dim); position: sticky; top: 0; background: var(--hb); }
    .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; padding-bottom: 6px; }
    .grid button { aspect-ratio: 1; border-radius: 8px; border: 0; background: transparent; font-size: 22px; cursor: pointer; line-height: 1; padding: 0; font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
    .grid button:hover { background: var(--hov); }
    .grid button.sel { background: var(--btn); box-shadow: inset 0 0 0 2px var(--accbg); }
    .foot { border-top: 1px solid var(--brd); padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--dim); flex: none; }
    .foot .cur { display: flex; align-items: center; gap: 8px; min-width: 0; } .foot .cur b { font-size: 20px; font-weight: 400; font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
    .foot .cur span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .foot .src { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .empty { padding: 30px 0; text-align: center; color: var(--dim); }
  </style>
</head>
<body>
  <div class="pk">
    <div class="top"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" placeholder="Search emoji" autocomplete="off" spellcheck="false"></div><kbd>Esc</kbd></div>
    <div class="cats" id="cats"></div>
    <div class="body" id="body"></div>
    <div class="foot"><div class="cur"><b id="curch">😀</b><span id="curname">grinning face</span></div><div class="src"><i class="fa-solid fa-keyboard"></i><span id="src">Emoji key</span></div></div>
  </div>
  <script src="emoji-data.js"></script>
  <script src="emoji.js"></script>
</body>
</html>
