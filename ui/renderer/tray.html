<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self';">
  <link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
  <style>
    :root, [data-theme="light"], [data-theme="ubuntu"] { --hb: #fff; --fg: rgba(0,0,0,.85); --dim: rgba(0,0,0,.55); --brd: rgba(0,0,0,.12); --btn: rgba(0,0,0,.08); --hov: rgba(0,0,0,.06); --trk: rgba(0,0,0,.12); --accbg: #3584e4; --ok: #1b8553; --warn: #9c6800; --err: #c30000; }
    [data-theme="dark"], [data-theme="ubuntu-dark"] { --hb: #2e2e32; --fg: #fff; --dim: rgba(255,255,255,.55); --brd: rgba(255,255,255,.12); --btn: rgba(255,255,255,.1); --hov: rgba(255,255,255,.08); --trk: rgba(255,255,255,.14); --accbg: #3584e4; --ok: #78e9ab; --warn: #ffc252; --err: #ff938c; }
    [data-theme="ubuntu"], [data-theme="ubuntu-dark"] { --accbg: #e95420; }
    html, body { margin: 0; background: transparent; height: 100%; overflow: hidden; }
    body { font: 13px Cantarell, "Adwaita Sans", "Noto Sans", Inter, system-ui, sans-serif; color: var(--fg); }
    .pop { position: absolute; inset: 0; background: var(--hb); border-radius: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.35); padding: 8px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box; }
    .dev { padding: 10px 12px; border-radius: 9px; display: flex; flex-direction: column; gap: 8px; }
    .dev .top { display: flex; justify-content: space-between; align-items: baseline; }
    .dev .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .dev .name i { color: var(--dim); font-size: 12px; }
    .dev .bat { font-size: 12px; }
    .bar { height: 6px; border-radius: 3px; background: var(--trk); overflow: hidden; }
    .bar div { height: 100%; border-radius: 3px; }
    .hosts { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
    .hosts span.l { flex: 1; }
    .hosts button { width: 26px; height: 22px; border-radius: 5px; border: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; background: var(--btn); color: var(--fg); cursor: pointer; padding: 0; }
    .hosts button:hover { background: var(--hov); }
    .hosts button.on { background: var(--accbg); color: #fff; }
    .sep { height: 1px; background: var(--brd); margin: 4px 8px; }
    .act { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 9px; font: 14px Cantarell, "Adwaita Sans", system-ui, sans-serif; color: var(--fg); cursor: pointer; display: flex; align-items: center; gap: 12px; }
    .act:hover { background: var(--hov); }
    .act i { width: 16px; color: var(--dim); text-align: center; }
    .empty { padding: 14px 12px; font-size: 13px; color: var(--dim); }
  </style>
</head>
<body>
  <div class="pop" id="pop"></div>
  <script src="tray.js"></script>
</body>
</html>
